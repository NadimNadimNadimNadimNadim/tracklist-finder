version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*", "miniflare"]
      tooling:
        patterns: ["vitest", "@vitest/*", "typescript", "typescript-eslint", "eslint"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
