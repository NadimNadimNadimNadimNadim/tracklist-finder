version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*", "miniflare"]
      tooling:
        patterns: ["vitest", "@vitest/*", "typescript", "typescript-eslint", "eslint"]
    ignore:
      # @cloudflare/vitest-pool-workers only supports vitest 4. Lift once it accepts 5.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # typescript-eslint only supports typescript below 6.1. Lift once it accepts newer.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version, so update them together.
      codeql:
        patterns: ["github/codeql-action*"]
