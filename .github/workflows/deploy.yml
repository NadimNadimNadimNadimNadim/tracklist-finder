name: Deploy

# Every push to main goes through CI, then staging, then production.
# Production uses a GitHub environment, so you can require your own approval there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy to staging
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: npx wrangler deploy --env staging --var "VERSION:$SHA" --message "deploy $SHA"

      - name: Smoke test staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          test -n "$STAGING_URL" || { echo "Set the STAGING_URL repository variable to your staging address."; exit 1; }
          node scripts/smoke.mjs "$STAGING_URL" --live

  production:
    name: Deploy to production
    needs: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: npx wrangler deploy --env production --var "VERSION:$SHA" --message "deploy $SHA"

      - name: Smoke test production
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_URL" || { echo "Set the PRODUCTION_URL repository variable to your production address."; exit 1; }
          node scripts/smoke.mjs "$PRODUCTION_URL" --live
